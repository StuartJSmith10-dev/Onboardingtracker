spring.application.name=onboarding-tracker

# 1. Update this line to use a local file path instead of "mem"
spring.datasource.url=jdbc:h2:file:./data/onboardingdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

# 2. Keep these two lines exactly as they are!
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true